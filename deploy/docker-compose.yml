version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fastq-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 100
      --dir /data"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastq:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: fastq-log-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      REDIS_KEY: fastq:log:queue
      LOG_DIR: /app/logs
      CONCURRENCY: 5
    volumes:
      - ../logs:/app/logs

volumes:
  redis_data:
